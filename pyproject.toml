[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfexact"
version = "0.1.0"
description = "Convertisseur PDF natif vers DOCX à fidélité visuelle"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "fonttools>=4.50",
    "pillow>=10.0",
    "rapidocr>=3.9",
    "onnxruntime>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "scikit-image>=0.22",
    "numpy>=1.26",
]
layout-ai = [
    "paddlepaddle==3.2.0",
    "paddlex[ocr]==3.3.11",
]
local-comprehension = [
    "ctranslate2==4.8.0",
    "tokenizers==0.23.1",
]

[project.scripts]
pdfexact = "pdfexact.cli:main"
pdfexact-fonts = "pdfexact.fonts_cli:main"
pdfexact-web = "pdfexact.web:main"

[tool.setuptools.packages.find]
include = ["pdfexact*"]

[tool.setuptools.package-data]
pdfexact = ["data/*.json", "fonts/*.ttf", "fonts/*.otf", "fonts/*.ttc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
